version: 1
customer:
  slug: acme
  display: ACME 코퍼레이션
  status: active
  contact: aj@acme.example

ddl:
  dialect: postgres

mybatis:
  base_package: com.acme
  project_root_pkg: com.acme.uiadapter
  uia_namespace: jakarta
  table_prefix: ACM_
  url_prefix: /acmuiadapter

nexacro:
  default_pattern: D2
  frame: packageN

overlay:
  target_pkg_prefix: com.acme.uiadapter
  shell_app_id: acme-portal
  # Growth-80 — Keycloak multi-client + LDAP federation (uncomment to activate):
  # sso_ldap: true
  # sso_clients:
  #   - id: acme-app
  #   - id: acme-admin
  maven:
    group_id: com.acme
    artifact_id_template: "{slug}-shell"
    version: 2.0.0-SNAPSHOT
  datasource:
    username: ${ACME_DB_USER}
    password: ${ACME_DB_PASS}
    url_template: "jdbc:postgresql://db.acme.internal:5432/acme_prod"

auth:
  mode: session
  lane: jakarta

defaults:
  lane: jakarta
  ui: nexacro

datasource:
  username: ${ACME_DB_USER}
  password: ${ACME_DB_PASS}
  url_template: "jdbc:postgresql://{host}:{port}/{db}"
  host: db.acme.internal
  port: 5432
  db: acme_prod

# Growth-80 — LDAP federation (uncomment + set ACME_LDAP_BIND_PW env var):
# ldap:
#   host: ldap.acme.internal
#   port: 389
#   bind_dn: "cn=admin,dc=acme,dc=internal"
#   bind_credential: "${ACME_LDAP_BIND_PW}"
#   users_dn: "ou=people,dc=acme,dc=internal"

domains_seen: []
